<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise</title>

<link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Baloo 2', cursive;
}


/* =========================================================
   PAGE 1
========================================================= */

#page1 {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at top left,
            #e8d9ff,
            #fcd8e8
        );

    transition:
        opacity 1.4s ease,
        transform 1.4s ease,
        visibility 1.4s ease;
}

#page1.hide {
    opacity: 0;
    transform: scale(1.06);
    visibility: hidden;
    pointer-events: none;
}

.page1-title {
    font-size: 2.5rem;
    color: #1a1a1a;
    margin-bottom: 35px;
    letter-spacing: 1px;

    text-shadow:
        0 3px 8px rgba(0,0,0,0.12);
}


/* =========================================================
   GIFT
========================================================= */

.gift-box {
    width: 240px;
    cursor: pointer;

    transition:
        transform 0.3s ease,
        filter 0.3s ease;
}

.gift-box:hover {
    transform: scale(1.06);

    filter:
        drop-shadow(
            0 12px 15px
            rgba(0,0,0,0.18)
        );
}


/* =========================================================
   OPEN BUTTON
========================================================= */

.open-btn {
    margin-top: 40px;

    background: #ff3b3b;
    color: white;

    border: none;

    padding:
        16px 42px;

    border-radius: 35px;

    font-family:
        'Baloo 2',
        cursive;

    font-size: 1.3rem;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 8px 18px
        rgba(0,0,0,0.25);

    transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
}

.open-btn:hover {
    background: #ff5555;

    transform:
        scale(1.08);

    box-shadow:
        0 12px 25px
        rgba(0,0,0,0.28);
}


/* =========================================================
   GIFT SHAKE
========================================================= */

@keyframes shake {

    0% {
        transform: rotate(0deg);
    }

    20% {
        transform: rotate(-7deg);
    }

    40% {
        transform: rotate(7deg);
    }

    60% {
        transform: rotate(-5deg);
    }

    80% {
        transform: rotate(4deg);
    }

    100% {
        transform: rotate(0deg);
    }
}

.shake {
    animation:
        shake 0.7s ease;
}


/* =========================================================
   MUSIC
========================================================= */

#birthdaySong {
    display: none;
}


/* =========================================================
   PAGE 2
========================================================= */

#page2 {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #ffb6c1,
            #ffd1dc
        );

    opacity: 0;

    transform:
        scale(0.96);

    pointer-events: none;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;
}

#page2.show {
    opacity: 1;

    transform:
        scale(1);

    pointer-events: auto;
}


/* =========================================================
   CANVAS
========================================================= */

.canvas {
    position: relative;

    width: 800px;
    height: 550px;

    background:
        url('gradient-bg.jpeg')
        center / cover
        no-repeat;

    border-radius: 20px;

    border:
        6px solid
        rgba(255,255,255,0.8);

    box-shadow:
        0 0 25px
        rgba(0,0,0,0.35);

    overflow: hidden;
}


/* =========================================================
   BACK ELEMENTS
========================================================= */

.back-layer {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 1;
}


/* =========================================================
   PARTY HAT
========================================================= */

.hat {
    position: absolute;

    top: -100px;
    left: 20px;

    width: 400px;

    transform:
        rotate(-10deg);

    z-index: 20;
}


/* =========================================================
   KRISLIN
========================================================= */

.krislin {
    position: absolute;

    top: 95px;
    left: 65px;

    width: 280px;

    border-radius: 20px;

    box-shadow:
        0 8px 16px
        rgba(0,0,0,0.25);

    z-index: 10;

    opacity: 0;

    transform-origin:
        center center;
}


/* =========================================================
   KRISLIN ENTRANCE
========================================================= */

@keyframes krislinEntrance {

    0% {
        opacity: 0;

        transform:
            translateY(-150px)
            scale(0.35)
            rotate(0deg);
    }

    18% {
        opacity: 1;

        transform:
            translateY(-115px)
            scale(0.52)
            rotate(-90deg);
    }

    38% {
        transform:
            translateY(-75px)
            scale(0.72)
            rotate(-180deg);
    }

    58% {
        transform:
            translateY(-35px)
            scale(0.92)
            rotate(-270deg);
    }

    75% {
        transform:
            translateY(5px)
            scale(1.08)
            rotate(-360deg);
    }

    84% {
        transform:
            translateY(-7px)
            scale(1.04)
            rotate(-360deg);
    }

    92% {
        transform:
            translateY(3px)
            scale(1.01)
            rotate(-360deg);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1)
            rotate(-360deg);
    }
}

.krislin.enter {
    animation:
        krislinEntrance
        4.5s
        cubic-bezier(
            .22,
            .61,
            .36,
            1
        )
        forwards;
}


/* =========================================================
   CAKE
========================================================= */

.cake {
    position: absolute;

    top: -10px;
    right: 100px;

    width: 300px;

    cursor: pointer;

    z-index: 60;

    transform-origin:
        center bottom;

    transition:
        filter 0.25s ease;
}

.cake:hover {
    filter:
        drop-shadow(
            0 12px 15px
            rgba(0,0,0,0.25)
        );
}


/* =========================================================
   CAKE FLOAT
========================================================= */

@keyframes cakeFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-7px);
    }
}

.cake.idle {
    animation:
        cakeFloat
        3s
        ease-in-out
        infinite;
}


/* =========================================================
   CAKE BOUNCE
========================================================= */

@keyframes cakeBounce {

    0% {
        transform:
            scale(1)
            translateY(0);
    }

    25% {
        transform:
            scale(1.12)
            translateY(-18px);
    }

    45% {
        transform:
            scale(0.97)
            translateY(3px);
    }

    65% {
        transform:
            scale(1.05)
            translateY(-8px);
    }

    82% {
        transform:
            scale(0.99)
            translateY(2px);
    }

    100% {
        transform:
            scale(1)
            translateY(0);
    }
}

.cake.bounce {
    animation:
        cakeBounce
        0.9s
        cubic-bezier(
            .34,
            1.56,
            .64,
            1
        );
}


/* =========================================================
   HAPPY BIRTHDAY
========================================================= */

.title {
    position: absolute;

    top: -120px;
    right: 60px;

    width: 370px;

    z-index: 40;
}


/* =========================================================
   MAKE A WISH
========================================================= */

:root {
    --wish-top: 355px;
}

.makewish {
    position: absolute;

    top:
        var(--wish-top);

    right: 5px;

    transform:
        translateX(-50%);

    background: white;

    color: #222;

    padding:
        5px 25px;

    border-radius: 30px;

    font-size: 1.8rem;
    font-weight: 700;

    box-shadow:
        0 6px 12px
        rgba(0,0,0,0.25);

    white-space: nowrap;

    z-index: 50;

    pointer-events: none;
}


/* =========================================================
   BUTTONS
========================================================= */

.buttons {
    position: absolute;

    bottom: 50px;
    left: 72%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 20px;

    z-index: 100;
}

.btn {
    border: none;

    padding:
        14px 32px;

    border-radius: 30px;

    font-family:
        'Baloo 2',
        cursive;

    font-size: 1.2rem;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 6px 12px
        rgba(0,0,0,0.25);

    transition:
        transform
        0.35s
        cubic-bezier(
            .22,
            .61,
            .36,
            1
        );

    will-change:
        transform;
}

.btn:hover {
    box-shadow:
        0 9px 18px
        rgba(0,0,0,0.28);
}

.btn-black {
    background: #222;
    color: white;
}

.btn-red {
    background: #ff3b3b;
    color: white;
}

.btn-yellow {
    background: #ffcc00;
    color: #222;
}


/* =========================================================
   PAGE 3
========================================================= */

#page3 {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        #f9bfc4;

    opacity: 0;

    transform:
        scale(0.96);

    pointer-events: none;

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}

#page3.show {
    opacity: 1;

    transform:
        scale(1);

    pointer-events: auto;
}


/* =========================================================
   FINAL CANVAS
========================================================= */

.final-canvas {
    position: relative;

    width: 800px;
    height: 550px;

    background:
        url('gradient-bg.jpeg')
        center / cover
        no-repeat;

    border-radius: 20px;

    border:
        6px solid
        rgba(255,255,255,0.8);

    box-shadow:
        0 0 20px
        rgba(0,0,0,0.4);

    overflow: hidden;
}


/* =========================================================
   FINAL BACK
========================================================= */

.final-back {
    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   FINAL KRISLIN
========================================================= */

.final-krislin {
    position: absolute;

    top: 50px;
    left: 52%;

    transform:
        translateX(-50%);

    width: 220px;

    border-radius: 10px;

    box-shadow:
        0 6px 12px
        rgba(0,0,0,0.25);

    z-index: 1;
}


/* =========================================================
   FINAL HAT
========================================================= */

.final-hat {
    position: absolute;

    top: -80px;
    left: 52%;

    transform:
        translateX(-50%)
        rotate(-10deg);

    width: 300px;

    z-index: 2;

    pointer-events: none;
}


/* =========================================================
   ANIMALS
========================================================= */

.animals {
    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;
}

.monkey-left {
    position: absolute;

    bottom: 140px;
    left: 150px;

    width: 160px;

    z-index: 5;
}

.mouse-left {
    position: absolute;

    bottom: 60px;
    left: 80px;

    width: 120px;

    z-index: 6;
}

.monkey-right {
    position: absolute;

    bottom: 1px;
    right: 40px;

    width: 180px;

    z-index: 5;
}

.cat-right {
    position: absolute;

    bottom: 150px;
    right: 130px;

    width: 150px;

    z-index: 6;
}


/* =========================================================
   FINAL TEXT
========================================================= */

.text {
    position: absolute;

    bottom: 50px;
    left: 50%;

    transform:
        translateX(-50%);

    text-align: center;

    color: #222;

    font-size: 1.3rem;
    font-weight: 700;

    z-index: 20;

    width: 100%;
}


/* =========================================================
   FINAL BUTTON
========================================================= */

.highlight {
    display: inline-block;

    background: #b92f46;

    color: white;

    padding:
        7px 17px;

    border-radius: 9px;

    margin-top: 10px;

    font-size: 1.2rem;

    cursor: pointer;

    user-select: none;

    box-shadow:
        0 5px 12px
        rgba(70,0,15,0.3);

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.highlight:hover {
    transform:
        scale(1.08);

    background:
        #9f253b;

    box-shadow:
        0 8px 18px
        rgba(70,0,15,0.35);
}

.highlight:active {
    transform:
        scale(.92);
}


/* =========================================================
   EFFECTS
========================================================= */

.effects {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 999999;

    pointer-events: none;

    overflow: hidden;
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti {
    position: absolute;

    top: -25px;

    width: 9px;
    height: 15px;

    border-radius: 2px;

    opacity: 1;

    pointer-events: none;

    will-change:
        transform;

    animation:
        confettiFall
        var(--duration)
        linear
        var(--delay)
        forwards;
}

@keyframes confettiFall {

    0% {
        opacity: 1;

        transform:
            translate3d(
                0,
                -25px,
                0
            )
            rotate(0deg);
    }

    20% {
        opacity: 1;

        transform:
            translate3d(
                var(--sway1),
                20vh,
                0
            )
            rotate(
                var(--rotation1)
            );
    }

    40% {
        opacity: 1;

        transform:
            translate3d(
                var(--sway2),
                40vh,
                0
            )
            rotate(
                var(--rotation2)
            );
    }

    60% {
        opacity: 1;

        transform:
            translate3d(
                var(--sway3),
                60vh,
                0
            )
            rotate(
                var(--rotation3)
            );
    }

    80% {
        opacity: 1;

        transform:
            translate3d(
                var(--sway4),
                80vh,
                0
            )
            rotate(
                var(--rotation4)
            );
    }

    98% {
        opacity: 1;

        transform:
            translate3d(
                var(--sway5),
                105vh,
                0
            )
            rotate(
                var(--rotation5)
            );
    }

    100% {
        opacity: 0;

        transform:
            translate3d(
                var(--sway5),
                110vh,
                0
            )
            rotate(
                var(--rotation5)
            );
    }
}


/* =========================================================
   BALLOONS
========================================================= */

.balloon {
    position: absolute;

    bottom: -90px;

    left:
        var(--left);

    font-size:
        var(--size);

    line-height: 1;

    opacity: 1;

    pointer-events: none;

    will-change:
        transform;

    animation:
        balloonRise
        var(--duration)
        linear
        var(--delay)
        forwards;
}

@keyframes balloonRise {

    0% {
        opacity: 1;

        transform:
            translate3d(
                0,
                90px,
                0
            )
            rotate(
                var(--rotateStart)
            );
    }

    20% {
        opacity: 1;

        transform:
            translate3d(
                var(--x1),
                -20vh,
                0
            )
            rotate(
                var(--rotate1)
            );
    }

    40% {
        opacity: 1;

        transform:
            translate3d(
                var(--x2),
                -40vh,
                0
            )
            rotate(
                var(--rotate2)
            );
    }

    60% {
        opacity: 1;

        transform:
            translate3d(
                var(--x3),
                -60vh,
                0
            )
            rotate(
                var(--rotate3)
            );
    }

    80% {
        opacity: 1;

        transform:
            translate3d(
                var(--x4),
                -80vh,
                0
            )
            rotate(
                var(--rotate4)
            );
    }

    98% {
        opacity: 1;

        transform:
            translate3d(
                var(--x5),
                -110vh,
                0
            )
            rotate(
                var(--rotate5)
            );
    }

    100% {
        opacity: 0;

        transform:
            translate3d(
                var(--x5),
                -120vh,
                0
            )
            rotate(
                var(--rotate5)
            );
    }
}


/* =========================================================
   BLOW CANDLES PAGE
========================================================= */

#candlePage {
    position: fixed;

    inset: 0;

    z-index: 5000;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            #625b5b 0%,
            #4a4444 55%,
            #353131 100%
        );

    color: white;

    opacity: 0;

    transform:
        scale(0.96);

    pointer-events: none;

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;

    overflow: hidden;
}

#candlePage.show {
    opacity: 1;

    transform:
        scale(1);

    pointer-events: auto;
}


/* =========================================================
   CANDLE COUNTDOWN
========================================================= */

.countdown {
    position: absolute;

    top: 35px;
    left: 35px;

    width: 78px;
    height: 78px;

    background:
        rgba(255,255,255,0.96);

    color:
        #3b3535;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 2rem;

    font-weight: 800;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,0.25),

        inset 0 0 0 5px
        rgba(255,255,255,0.35);

    z-index: 20;

    transition:
        transform 0.2s ease;
}

.countdown.pulse {
    transform:
        scale(1.12);
}


/* =========================================================
   CANDLE SCENE
========================================================= */

.candle-scene {
    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding-top: 40px;
}


/* =========================================================
   CANDLES
========================================================= */

.candles {
    display: flex;

    align-items: flex-end;
    justify-content: center;

    gap: 28px;

    height: 330px;

    margin-bottom: 35px;
}

.candle-wrapper {
    position: relative;

    width: 62px;
    height: 250px;

    display: flex;

    align-items: flex-end;
    justify-content: center;
}

.candle {
    position: relative;

    width: 58px;
    height: 190px;

    border-radius:
        10px 10px 7px 7px;

    box-shadow:
        inset 8px 0 12px
        rgba(255,255,255,0.25),

        inset -8px 0 12px
        rgba(0,0,0,0.15),

        0 12px 18px
        rgba(0,0,0,0.25);

    overflow: visible;
}


/* =========================================================
   CANDLE TOP
========================================================= */

.candle::before {
    content: "";

    position: absolute;

    width: 58px;
    height: 18px;

    top: -8px;
    left: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,0.65) 0%,
            rgba(255,255,255,0.25) 45%,
            rgba(0,0,0,0.12) 100%
        );

    box-shadow:
        inset 0 -3px 4px
        rgba(0,0,0,0.15);
}


/* =========================================================
   WAX
========================================================= */

.wax {
    position: absolute;

    top: 2px;

    width: 9px;

    border-radius:
        0 0 8px 8px;

    background:
        rgba(255,255,255,0.55);

    filter:
        blur(0.2px);
}

.wax.one {
    left: 12px;
    height: 34px;
}

.wax.two {
    right: 14px;
    height: 22px;
}

.wax.three {
    left: 29px;
    height: 13px;
}


/* =========================================================
   WICK
========================================================= */

.wick {
    position: absolute;

    top: -25px;
    left: 50%;

    width: 4px;
    height: 22px;

    transform:
        translateX(-50%);

    background:
        #211c1c;

    border-radius: 50%;

    z-index: 5;
}


/* =========================================================
   FLAME
========================================================= */

.flame {
    position: absolute;

    top: -73px;
    left: 50%;

    width: 38px;
    height: 62px;

    transform:
        translateX(-50%);

    transform-origin:
        center bottom;

    z-index: 10;

    animation:
        flameDance
        0.8s
        infinite
        ease-in-out
        alternate,

        flameGlow
        1.2s
        infinite
        ease-in-out
        alternate;
}


/* =========================================================
   OUTER FLAME
========================================================= */

.flame::before {
    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    border-radius:
        50% 50% 45% 45% /
        65% 65% 35% 35%;

    background:
        radial-gradient(
            ellipse at 50% 75%,
            #fff7a0 0%,
            #ffd23f 25%,
            #ff9d1c 52%,
            #ff5c16 75%,
            rgba(255,70,0,0) 100%
        );

    filter:
        blur(0.4px);

    box-shadow:
        0 0 18px
        rgba(255,174,45,0.8),

        0 0 35px
        rgba(255,117,20,0.45);
}


/* =========================================================
   INNER FLAME
========================================================= */

.flame::after {
    content: "";

    position: absolute;

    width: 15px;
    height: 30px;

    left: 50%;
    bottom: 5px;

    transform:
        translateX(-50%);

    border-radius:
        50% 50% 45% 45%;

    background:
        radial-gradient(
            ellipse at center bottom,
            #ffffff 0%,
            #fffbd0 35%,
            #ffd84d 70%,
            transparent 100%
        );

    filter:
        blur(0.5px);
}


/* =========================================================
   FLAME ANIMATION
========================================================= */

@keyframes flameDance {

    0% {
        transform:
            translateX(-50%)
            rotate(-4deg)
            scale(1,1);
    }

    25% {
        transform:
            translateX(-50%)
            rotate(3deg)
            scale(0.92,1.08);
    }

    50% {
        transform:
            translateX(-50%)
            rotate(-2deg)
            scale(1.05,0.95);
    }

    75% {
        transform:
            translateX(-50%)
            rotate(5deg)
            scale(0.95,1.06);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(-3deg)
            scale(1.02,0.97);
    }
}

@keyframes flameGlow {

    0% {
        filter:
            brightness(0.95);
    }

    100% {
        filter:
            brightness(1.15);
    }
}


/* =========================================================
   CANDLE COLORS
========================================================= */

.pink {
    background:
        repeating-linear-gradient(
            135deg,
            #ff7fa9 0px,
            #ff7fa9 18px,
            #ffb3c8 18px,
            #ffb3c8 28px
        );
}

.purple {
    background:
        linear-gradient(
            90deg,
            #9c70e8,
            #c49cff 45%,
            #8759d3
        );
}

.blue {
    background:
        repeating-linear-gradient(
            -45deg,
            #4eb8e8 0px,
            #4eb8e8 15px,
            #86d9fa 15px,
            #86d9fa 28px
        );
}

.yellow {
    background:
        linear-gradient(
            90deg,
            #f7b84b,
            #ffe083 45%,
            #efa936
        );
}

.green {
    background:
        repeating-linear-gradient(
            45deg,
            #69d39b 0px,
            #69d39b 17px,
            #9aebba 17px,
            #9aebba 29px
        );
}

.orange {
    background:
        linear-gradient(
            90deg,
            #f4774b,
            #ffab78 45%,
            #e95d39
        );
}


/* =========================================================
   SPARKLES
========================================================= */

.candle-sparkle {
    position: absolute;

    color:
        #fff4c7;

    font-size: 20px;

    opacity: 0.75;

    animation:
        sparkle
        2s
        infinite
        ease-in-out;
}

.s1 {
    top: 20%;
    left: 25%;
}

.s2 {
    top: 28%;
    right: 25%;

    animation-delay:
        0.5s;
}

.s3 {
    bottom: 25%;
    left: 22%;

    animation-delay:
        1s;
}

.s4 {
    bottom: 27%;
    right: 22%;

    animation-delay:
        1.5s;
}

@keyframes sparkle {

    0%,
    100% {
        opacity: 0.25;

        transform:
            scale(0.8)
            rotate(0deg);
    }

    50% {
        opacity: 1;

        transform:
            scale(1.25)
            rotate(20deg);
    }
}


/* =========================================================
   BLOW BUTTON
========================================================= */

.label {
    background:
        rgba(255,255,255,0.96);

    color:
        #322d2d;

    padding:
        10px 25px;

    border-radius:
        12px;

    font-size:
        1.2rem;

    font-weight:
        800;

    box-shadow:
        0 7px 18px
        rgba(0,0,0,0.2);

    letter-spacing:
        0.5px;

    cursor:
        pointer;

    user-select:
        none;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}


/* =========================================================
   BUTTON READY
========================================================= */

.label.ready {
    animation:
        buttonBounce
        0.8s
        infinite
        ease-in-out;

    background:
        #ffffff;

    box-shadow:
        0 0 0 6px
        rgba(255,255,255,0.15),

        0 10px 25px
        rgba(0,0,0,0.3);

    font-size:
        1.35rem;
}

@keyframes buttonBounce {

    0%,
    100% {
        transform:
            scale(1)
            translateY(0);
    }

    50% {
        transform:
            scale(1.18)
            translateY(-8px);
    }
}


/* =========================================================
   BUTTON CLICK
========================================================= */

.label.blowing {
    animation:
        none;

    transform:
        scale(0.92);

    background:
        #eeeeee;
}


/* =========================================================
   BLOWN FLAMES
========================================================= */

.blown .flame {
    animation:
        flameBlow
        0.45s
        ease-out
        forwards;
}

@keyframes flameBlow {

    0% {
        opacity: 1;

        transform:
            translateX(-50%)
            scale(1);
    }

    40% {
        opacity: 0.8;

        transform:
            translateX(-70%)
            scale(0.8,1.2)
            rotate(-20deg);
    }

    100% {
        opacity: 0;

        transform:
            translateX(-110%)
            scale(0.15,0.8)
            rotate(-45deg);
    }
}


/* =========================================================
   SMOKE
========================================================= */

.smoke {
    position: absolute;

    top: -55px;
    left: 50%;

    width: 12px;
    height: 35px;

    transform:
        translateX(-50%);

    border-radius:
        50%;

    background:
        rgba(210,210,210,0.25);

    filter:
        blur(5px);

    animation:
        smoke
        2s
        ease-out
        forwards;
}

@keyframes smoke {

    0% {
        opacity: 0.5;

        transform:
            translate(-50%,0)
            scale(0.7);
    }

    100% {
        opacity: 0;

        transform:
            translate(-20%,-60px)
            scale(1.7);
    }
}

   MOBILE FIX — DO NOT CHANGE OTHER PARTS
========================================================= */

@media (max-width:380px) {

</style>

<body>

<script>


/* =========================================================
   ELEMENTS
========================================================= */

const page1 =
    document.getElementById("page1");

const page2 =
    document.getElementById("page2");

const candlePage =
    document.getElementById("candlePage");

const page3 =
    document.getElementById("page3");

const openBtn =
    document.getElementById("openBtn");

const gift =
    document.getElementById("gift");

const song =
    document.getElementById("birthdaySong");

const canvas =
    document.getElementById("canvas");

const krislin =
    document.getElementById("krislin");

const cake =
    document.getElementById("cake");

const effects =
    document.getElementById("effects");

const btnBlack =
    document.getElementById("btnBlack");

const btnRed =
    document.getElementById("btnRed");

const btnYellow =
    document.getElementById("btnYellow");

const celebrateButton =
    document.getElementById("celebrateButton");


/* =========================================================
   PAGE 1 → PAGE 2
========================================================= */

openBtn.addEventListener(
    "click",
    () => {

        gift.classList.remove("shake");

        void gift.offsetWidth;

        gift.classList.add("shake");


        song.volume = 0.35;

        song.currentTime = 0;

        song.play().catch(
            error => {
                console.log(
                    "Audio could not start:",
                    error
                );
            }
        );


        setTimeout(
            () => {

                page1.classList.add("hide");

            },
            250
        );


        setTimeout(
            () => {

                page2.classList.add("show");


                krislin.classList.remove(
                    "enter"
                );

                void krislin.offsetWidth;

                krislin.classList.add(
                    "enter"
                );


                createCelebration();

            },
            850
        );

    }
);


/* =========================================================
   CELEBRATION
========================================================= */

function createCelebration() {

    createConfetti();

    createBalloons();

}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti() {

    const colors = [

        "#641b2e",
        "#7a2438",
        "#263b5a",
        "#315c4b",
        "#6b3e26",
        "#593b67",
        "#8a5424",
        "#292929",
        "#75264b",
        "#354b63"

    ];


    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const confetti =
            document.createElement(
                "div"
            );

        confetti.className =
            "confetti";


        confetti.style.left =
            Math.random() * 100 +
            "vw";


        confetti.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        confetti.style.width =
            (
                5 +
                Math.random() * 7
            ) + "px";

        confetti.style.height =
            (
                9 +
                Math.random() * 10
            ) + "px";


        confetti.style.setProperty(
            "--sway1",
            (
                (Math.random() - .5) *
                120
            ) + "px"
        );

        confetti.style.setProperty(
            "--sway2",
            (
                (Math.random() - .5) *
                200
            ) + "px"
        );

        confetti.style.setProperty(
            "--sway3",
            (
                (Math.random() - .5) *
                280
            ) + "px"
        );

        confetti.style.setProperty(
            "--sway4",
            (
                (Math.random() - .5) *
                360
            ) + "px"
        );

        confetti.style.setProperty(
            "--sway5",
            (
                (Math.random() - .5) *
                440
            ) + "px"
        );


        confetti.style.setProperty(
            "--rotation1",
            Math.random() * 360 +
            "deg"
        );

        confetti.style.setProperty(
            "--rotation2",
            Math.random() * 720 +
            "deg"
        );

        confetti.style.setProperty(
            "--rotation3",
            Math.random() * 1000 +
            "deg"
        );

        confetti.style.setProperty(
            "--rotation4",
            Math.random() * 1300 +
            "deg"
        );

        confetti.style.setProperty(
            "--rotation5",
            Math.random() * 1600 +
            "deg"
        );


        confetti.style.setProperty(
            "--duration",
            (
                4 +
                Math.random() * 2
            ) + "s"
        );


        confetti.style.setProperty(
            "--delay",
            (
                Math.random() * .7
            ) + "s"
        );


        if (
            Math.random() > .78
        ) {

            confetti.style.borderRadius =
                "50%";

        }


        effects.appendChild(
            confetti
        );


        setTimeout(
            () => {
                confetti.remove();
            },
            7500
        );

    }

}


/* =========================================================
   BALLOONS
========================================================= */

function createBalloons() {

    const balloonEmojis = [

        "🎈",
        "🎈",
        "🎈",
        "🎈"

    ];


    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const balloon =
            document.createElement(
                "div"
            );

        balloon.className =
            "balloon";


        balloon.innerText =
            balloonEmojis[
                Math.floor(
                    Math.random() *
                    balloonEmojis.length
                )
            ];


        balloon.style.setProperty(
            "--left",
            Math.random() * 100 +
            "vw"
        );


        balloon.style.setProperty(
            "--size",
            (
                48 +
                Math.random() * 28
            ) + "px"
        );


        balloon.style.setProperty(
            "--x1",
            (
                (Math.random() - .5) *
                80
            ) + "px"
        );

        balloon.style.setProperty(
            "--x2",
            (
                (Math.random() - .5) *
                150
            ) + "px"
        );

        balloon.style.setProperty(
            "--x3",
            (
                (Math.random() - .5) *
                220
            ) + "px"
        );

        balloon.style.setProperty(
            "--x4",
            (
                (Math.random() - .5) *
                300
            ) + "px"
        );

        balloon.style.setProperty(
            "--x5",
            (
                (Math.random() - .5) *
                380
            ) + "px"
        );


        balloon.style.setProperty(
            "--rotateStart",
            (
                -5 +
                Math.random() * 10
            ) + "deg"
        );

        balloon.style.setProperty(
            "--rotate1",
            (
                -8 +
                Math.random() * 16
            ) + "deg"
        );

        balloon.style.setProperty(
            "--rotate2",
            (
                -12 +
                Math.random() * 24
            ) + "deg"
        );

        balloon.style.setProperty(
            "--rotate3",
            (
                -15 +
                Math.random() * 30
            ) + "deg"
        );

        balloon.style.setProperty(
            "--rotate4",
            (
                -20 +
                Math.random() * 40
            ) + "deg"
        );

        balloon.style.setProperty(
            "--rotate5",
            (
                -25 +
                Math.random() * 50
            ) + "deg"
        );


        balloon.style.setProperty(
            "--duration",
            (
                4 +
                Math.random() * 1.5
            ) + "s"
        );


        balloon.style.setProperty(
            "--delay",
            (
                Math.random() * .5
            ) + "s"
        );


        effects.appendChild(
            balloon
        );


        setTimeout(
            () => {
                balloon.remove();
            },
            6500
        );

    }

}


/* =========================================================
   CAKE CLICK
========================================================= */

cake.addEventListener(

/* =========================================================
   RUN-AWAY BUTTONS
========================================================= */

function escapeButton(button) {

    const canvasRect =
        canvas.getBoundingClientRect();

    const buttonRect =
        button.getBoundingClientRect();

    const padding = 15;


    const maxX =
        canvas.clientWidth -
        button.offsetWidth -
        padding;

    const maxY =
        canvas.clientHeight -
        button.offsetHeight -
        padding;


    const randomX =
        padding +
        Math.random() *
        Math.max(
            1,
            maxX - padding
        );

    const randomY =
        padding +
        Math.random() *
        Math.max(
            1,
            maxY - padding
        );


    const x =
        randomX -
        (
            buttonRect.left -
            canvasRect.left
        );

    const y =
        randomY -
        (
            buttonRect.top -
            canvasRect.top
        );


    button.style.position =
        "relative";

    button.style.transform =
        `translate(${x}px, ${y}px)
         scale(1.05)
         rotate(${Math.random() * 8 - 4}deg)`;

}

/* =========================================================
   CANDLE SYSTEM
========================================================= */

let candleCount = 10;

const countDisplay =
    document.getElementById(
        "count"
    );

const candleElements =
    document.querySelectorAll(
        "#candlePage .candle"
    );

const blowButton =
    document.getElementById(
        "blowButton"
    );

let candleTimer = null;


/* =========================================================
   START COUNTDOWN
========================================================= */

function startCandleCountdown() {

    candleCount = 10;

    countDisplay.textContent =
        candleCount;

    blowButton.classList.remove(
        "ready"
    );

    blowButton.classList.remove(
        "blowing"
    );

    blowButton.textContent =
        "blow the candles";


    candleElements.forEach(
        candle => {

            candle.classList.remove(
                "blown"
            );

            const oldSmoke =
                candle.querySelector(
                    ".smoke"
                );

            if (oldSmoke) {
                oldSmoke.remove();
            }

        }
    );


    if (candleTimer) {
        clearInterval(
            candleTimer
        );
    }


    candleTimer =
        setInterval(
            () => {

                candleCount--;

                countDisplay.textContent =
                    candleCount;


                countDisplay.classList.add(
                    "pulse"
                );

                setTimeout(
                    () => {

                        countDisplay.classList.remove(
                            "pulse"
                        );

                    },
                    180
                );


                if (
                    candleCount === 0
                ) {

                    clearInterval(
                        candleTimer
                    );


                    blowButton.classList.add(
                        "ready"
                    );

                    blowButton.textContent =
                        "✨ blow the candles! ✨";

                }

            },
            1000
        );

}


/* =========================================================
   BLOW CANDLES
========================================================= */

blowButton.addEventListener(
    "click",
    () => {

        if (
            candleCount > 0
        ) {
            return;
        }


        blowButton.classList.remove(
            "ready"
        );

        blowButton.classList.add(
            "blowing"
        );

        blowButton.textContent =
            "💨 blowing...";


        candleElements.forEach(
            candle => {

                candle.classList.add(
                    "blown"
                );


                const smoke =
                    document.createElement(
                        "div"
                    );

                smoke.className =
                    "smoke";

                candle.appendChild(
                    smoke
                );

            }
        );


        setTimeout(
            () => {

                createConfetti();

                createBalloons();

            },
            500
        );


        setTimeout(
            () => {

                candlePage.classList.remove(
                    "show"
                );

                page3.classList.add(
                    "show"
                );


                setTimeout(
                    () => {

                        createCelebration();

                    },
                    600
                );

            },
            3000
        );

    }
);
